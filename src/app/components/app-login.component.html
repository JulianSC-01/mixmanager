<app-page-header>
  Login
</app-page-header>
@if (loginService.userLogout()) {
  <app-alert
    alertId="successHeader"
    alertType="alert-success">
    You have successfully logged out.
  </app-alert>
}
<app-form-error-header
  #formErrorHeader
  [errorMessage]="loginErrorMessage()"
  [errorFormGroup]="loginForm">
</app-form-error-header>
<form
  appFormA11y
  autocomplete="off"
  [formErrorHeader]="formErrorHeader"
  [formGroup]="loginForm"
  (ngSubmit)="login()">
  <fieldset>
    <legend class="sr-only">
      Login credentials
    </legend>
    <div class="col-sm-6 mb-3">
      <app-form-input-text
        formControlName="loginEmail"
        inputErrorMessageId="loginEmailError"
        inputLabelText="E-mail address"
        inputId="loginEmail"
        inputRequired="true"
        [inputErrorMessages]="errorMessageMap()">
      </app-form-input-text>
    </div>
    <div class="col-sm-6 mb-3">
      <app-form-input-text
        formControlName="loginPassword"
        inputErrorMessageId="loginPasswordError"
        inputLabelText="Password"
        inputId="loginPassword"
        inputRequired="true"
        inputType="password"
        [inputErrorMessages]="errorMessageMap()">
      </app-form-input-text>
    </div>
  </fieldset>
  <div class="mt-2">
    <button
      class="btn btn-primary"
      type="submit"
      [disabled]="loginInProgress()">
      Login
    </button>
    @if (loginInProgress()) {
      <span class="ms-2">
        <app-spinner
          spinnerSmall="true">
        </app-spinner>
      </span>
    }
  </div>
</form>
